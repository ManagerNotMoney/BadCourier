name: BadCourier
version: "0.0.7"
main: io.github.managernotmoney.Badmain
description: Дополнение к GreatWeeb – система закладок
author: ManagerMoney
api-version: "1.21"
depend: [GreatWeeb]
softdepend: [Vault]
commands:
  bc:
    description: Система закладок
    usage: /bc order
permissions:
  badcourier.use:
    description: Доступ к командам /bc
    default: op